name: Build ImmortalWrt RAX3000M 纯净版

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启SSH配置菜单'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 检查项目代码
        uses: actions/checkout@v4

      - name: 准备环境与安装依赖
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync \
            unzip zlib1g-dev file wget libelf-dev libtool autoconf automake make \
            zstd cpio device-tree-compiler scons qemu-utils
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 下载源码
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行 DIY 脚本
        run: |
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 准备默认配置
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig
          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y" .config || (echo "设备行被 defconfig 丢掉了，停止编译" && exit 1)

      - name: SSH 菜单配置
        uses: P3TERX/ssh2actions@main
        if: github.event.inputs.ssh == 'true'
        with:
          mode: tmate

      - name: 下载软件包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: 上传成品到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-cmcc_rax3000m
          path: openwrt/bin/targets/mediatek/filogic/

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RAX3000M 纯净版 build-${{ github.run_number }}
          files: |
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/config.buildinfo
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/version.buildinfo
          body: |
            ### RAX3000M 纯净版 (最新 master)
            - **设备**: cmcc_rax3000m
            - **默认IP**: 192.168.10.1
            - **内容**: LuCI + Argon 主题，其他官方默认
            - **构建ID**: ${{ github.run_id }}
